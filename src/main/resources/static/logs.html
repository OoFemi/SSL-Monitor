<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOB Uptime Monitor – Logs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>FOB Uptime Monitor</h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="admin.html">Admin</a></li>
            <li><a href="logs.html" class="active">Logs</a></li>
            <li><a href="settings.html">Settings</a></li>
        </ul>
        <div class="darkModeToggle">
            <input type="checkbox" id="darkModeCheckbox">
            <label for="darkModeCheckbox">Dark mode</label>
        </div>
    </div>

    <div class="main-content">
        <h1>System Audit Logs</h1>
        <p class="subtitle">Real-time enterprise event trail</p>

        <div class="actions-bar" style="margin-bottom: 20px;">
            <button id="refreshLogsBtn" class="btn primary">Refresh Logs</button>
            <button id="clearLogsBtn" class="btn secondary">Clear View</button>
        </div>

        <table class="uptime-table">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Target URL</th>
                    <th>Level</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <!-- Dynamically populated via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchLogsData() {
            try {
                const response = await fetch('/api/logs');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const logs = await response.json();

                const tbody = document.getElementById('logsTableBody');
                tbody.innerHTML = '';

                if (logs && logs.length > 0) {
                    // Reverse to show latest logs at the top
                    logs.slice().reverse().forEach(log => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${new Date(log.time).toLocaleTimeString()}</td>
                            <td>${log.url || '—'}</td>
                            <td><span class="badge ${log.level.toLowerCase()}">${log.level}</span></td>
                            <td>${log.message}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">No event logs recorded yet.</td></tr>`;
                }
            } catch (error) {
                console.error('Failed to fetch logs:', error);
            }
        }

        // Initial fetch on page load
        fetchLogsData();

        // Auto-refresh every 30 seconds
        setInterval(fetchLogsData, 30000);

        // Manual refresh button handler
        document.getElementById('refreshLogsBtn').addEventListener('click', fetchLogsData);

        document.getElementById('clearLogsBtn').addEventListener('click', () => {
            document.getElementById('logsTableBody').innerHTML = `<tr><td colspan="4" style="text-align: center;">Logs view cleared locally.</td></tr>`;
        });
    </script>
</body>
</html>
