<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOB SSL Monitor — Event & Alert Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { blue: '#0066ff', red: '#ff3333' },
                        slate: { 850: '#151f32', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex h-screen overflow-hidden">
    
    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div>
            <!-- Brand Header -->
            <div class="h-16 flex items-center px-6 border-b border-slate-800 space-x-3">
                <img src="/images/logo.png" alt="Company Logo" class="h-8 w-8 object-contain">
                <div>
                    <span class="font-bold tracking-wide text-sm block">FOB SSL Monitor</span>
                    <span class="text-[10px] text-brand-blue font-mono uppercase tracking-widest">v1.0.2 Enterprise</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="p-4 space-y-1">
                <a href="dashboard.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition text-sm">
                    <i class="fa-solid fa-chart-line w-5"></i>
                    <span>Dashboard</span>
                </a>
                <a href="admin.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition text-sm">
                    <i class="fa-solid fa-shield-halved w-5"></i>
                    <span>Admin</span>
                </a>
                <a href="logs.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-brand-blue/10 text-brand-blue font-medium text-sm border border-brand-blue/20">
                    <i class="fa-solid fa-terminal w-5"></i>
                    <span>Logs</span>
                </a>
                <a href="documentation.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition text-sm">
                    <i class="fa-solid fa-book w-5"></i>
                    <span>Documentation</span>
                </a>
                <a href="about.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition text-sm">
                    <i class="fa-solid fa-circle-info w-5"></i>
                    <span>About</span>
                </a>
                <a href="settings.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition text-sm">
                    <i class="fa-solid fa-gear w-5"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </div>

        <!-- System Theme Profile -->
        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center justify-between px-3 py-2.5 rounded-lg bg-slate-950/50 border border-slate-800/80">
                <div class="flex items-center space-x-3">
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="text-xs font-medium text-slate-300">Dark Mode</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="themeSwitch" class="sr-only peer" checked>
                    <div class="w-8 h-4 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-brand-blue"></div>
                </label>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        
        <!-- Header -->
        <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center px-6 justify-between z-10">
            <h1 class="text-lg font-semibold text-slate-100">Audit & SSL Alert Logs</h1>
            <button onclick="loadLogs()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-200 transition flex items-center space-x-2">
                <i class="fa-solid fa-rotate"></i>
                <span>Refresh Logs</span>
            </button>
        </header>

        <!-- Main Viewport -->
        <main class="flex-1 overflow-y-auto p-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                <div class="p-4 border-b border-slate-800 font-mono text-xs text-slate-400 flex justify-between items-center">
                    <span>System Log Terminal Feed (SSL Renewals, Downtime Alerts & Threshold Triggers)</span>
                    <span id="logCount" class="text-brand-blue font-semibold">0 entries loaded</span>
                </div>
                <div id="logConsole" class="p-4 font-mono text-xs space-y-2 h-[70vh] overflow-y-auto bg-slate-950/80">
                    <!-- Dynamic logs -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="h-10 bg-slate-900 border-t border-slate-800 flex items-center justify-center px-6 text-xs text-slate-500 font-mono">
            Developer: Femi Adeyemi for FOB IT  v1.0.2
        </footer>
    </div>

<script>
const API_BASE = "";

// Theme Switch Logic
const themeSwitch = document.getElementById("themeSwitch");
themeSwitch.addEventListener("change", () => {
    document.body.classList.toggle("dark", themeSwitch.checked);
});

async function loadLogs() {
    try {
        const res = await fetch(`${API_BASE}/api/logs`);
        const logs = await res.json();
        const consoleDiv = document.getElementById("logConsole");
        const logCountEl = document.getElementById("logCount");

        if (!Array.isArray(logs) || logs.length === 0) {
            consoleDiv.innerHTML = `<div class="text-slate-500 italic text-center py-6">No event or audit logs recorded yet.</div>`;
            logCountEl.textContent = "0 entries loaded";
            return;
        }

        logCountEl.textContent = `${logs.length} entries loaded`;
        consoleDiv.innerHTML = logs.map(l => {
            const timestampStr = l.timestamp ? new Date(l.timestamp).toISOString() : new Date().toISOString();
            const typeClass = l.type === 'ALERT' 
                ? 'text-brand-red font-bold' 
                : l.type === 'RENEWAL' 
                ? 'text-emerald-400 font-bold' 
                : 'text-brand-blue font-semibold';

            return `
                <div class="flex items-start space-x-3 border-b border-slate-800/40 pb-1.5 hover:bg-slate-900/40 px-2 py-1 rounded transition">
                    <span class="text-slate-500 whitespace-nowrap">[${timestampStr}]</span>
                    <span class="${typeClass}">[${l.type || 'INFO'}]</span>
                    <span class="text-slate-200 break-all">${l.message || ''}</span>
                </div>
            `;
        }).join("");
    } catch (e) {
        console.error("Failed to fetch audit logs:", e);
        document.getElementById("logConsole").innerHTML = `<div class="text-brand-red italic text-center py-6">Failed to retrieve system logs from server.</div>`;
    }
}

loadLogs();
setInterval(loadLogs, 10000);
</script>
</body>
</html>
