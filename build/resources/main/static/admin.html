<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FOB Uptime Monitor — Admin Command Center</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="sidebar">
    <h2>FOB ENTERPRISE</h2>
    <p>GLOBAL OPS V4.2</p>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="admin.html" class="active">Admin</a>
      <a href="logs.html">Logs</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="dark-toggle">
      <label>Dark Mode</label>
      <input type="checkbox" id="darkMode" checked />
    </div>
  </div>

  <main>
    <h2>Manage Monitored URLs</h2>
    <p class="subtitle">Infrastructure Configuration & Provisioning</p>

    <section class="add-section">
      <h3>Add New Target Endpoint</h3>
      <form id="addForm">
        <label>Target URL</label>
        <input type="text" id="url" placeholder="https://example.com" required />

        <label>Category</label>
        <input type="text" id="category" placeholder="Production" required />

        <label>Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="Frontend,API" />

        <button type="submit" id="addBtn">+ Add URL Target</button>
      </form>
    </section>

    <section class="registry">
      <h3>Active Monitored URLs Registry</h3>
      <table id="urlTable">
        <thead>
          <tr>
            <th>URL</th>
            <th>Category</th>
            <th>Tags</th>
            <th>Status</th>
            <th>SSL Days</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
