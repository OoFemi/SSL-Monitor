<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>FOB SSL Monitor — Event & Alert Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { blue: '#0066ff', red: '#ff3333' },
                        slate: { 850: '#151f32', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex h-screen overflow-hidden">
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-slate-800 space-x-3">
                <div class="w-8 h-8 rounded bg-brand-blue flex items-center justify-center font-bold text-white">F</div>
                <div>
                    <span class="font-bold tracking-wide text-sm block">FOB SSL Monitor</span>
                    <span class="text-[10px] text-brand-blue font-mono uppercase tracking-widest">v1.0.2 Enterprise</span>
                </div>
            </div>
            <nav class="p-4 space-y-1">
                <a href="dashboard.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 transition text-sm"><i class="fa-solid fa-chart-line w-5"></i><span>Dashboard</span></a>
                <a href="admin.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 transition text-sm"><i class="fa-solid fa-shield-halved w-5"></i><span>Admin</span></a>
                <a href="logs.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-brand-blue/10 text-brand-blue font-medium text-sm border border-brand-blue/20"><i class="fa-solid fa-terminal w-5"></i><span>Logs</span></a>
                <a href="settings.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 transition text-sm"><i class="fa-solid fa-gear w-5"></i><span>Settings</span></a>
            </nav>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center px-6 justify-between">
            <h1 class="text-lg font-semibold text-slate-100">Audit & SSL Alert Logs</h1>
            <button onclick="loadLogs()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700"><i class="fa-solid fa-rotate mr-1"></i> Refresh Logs</button>
        </header>
        <main class="flex-1 overflow-y-auto p-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                <div class="p-4 border-b border-slate-800 font-mono text-xs text-slate-400">System Log Terminal Feed (SSL Renewals, Downtime Alerts & Threshold Triggers)</div>
                <div id="logConsole" class="p-4 font-mono text-xs space-y-2 h-[75vh] overflow-y-auto bg-slate-950/80">
                    <!-- Dynamic logs -->
                </div>
            </div>
        </main>
        <footer class="h-10 bg-slate-900 border-t border-slate-800 flex items-center justify-center px-6 text-xs text-slate-500 font-mono">
            Fiberone Broadband v1.0.2
        </footer>
    </div>

<script>
const API_BASE = "http://localhost:7000";
async function loadLogs() {
    const res = await fetch(`${API_BASE}/api/logs`);
    const logs = await res.json();
    const consoleDiv = document.getElementById("logConsole");
    consoleDiv.innerHTML = logs.map(l => `
        <div class="flex items-start space-x-3 border-b border-slate-800/40 pb-1.5">
            <span class="text-slate-500">${new Date(l.timestamp).toISOString()}</span>
            <span class="${l.type === 'ALERT' ? 'text-brand-red font-bold' : l.type === 'RENEWAL' ? 'text-emerald-400 font-bold' : 'text-brand-blue'}">[${l.type}]</span>
            <span class="text-slate-200">${l.message}</span>
        </div>
    `).join("");
}
loadLogs();
setInterval(loadLogs, 10000);
</script>
</body>
</html>
