<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FOB SSL Monitor Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 text-gray-900 transition-colors duration-200 min-h-screen flex flex-col justify-between" id="app-body">

    <!-- Top Navigation bar with Logo and User Menu -->
    <header class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <img id="company-logo" src="/uploads/company-logo.png" alt="Company Logo" class="h-10 w-auto object-contain">
            <span class="text-xl font-bold tracking-wide">FOB SSL Monitor</span>
        </div>
        <nav class="flex items-center space-x-6">
            <a href="#dashboard-view" class="font-medium hover:text-blue-600">Dashboard</a>
            <a href="#admin-view" class="font-medium hover:text-blue-600">Admin Panel</a>
            <a href="/documentation" target="_blank" class="font-medium hover:text-blue-600">Documentation</a>
            <!-- User Menu -->
            <div class="relative">
                <button id="userMenuBtn" class="flex items-center space-x-2 focus:outline-none bg-gray-200 px-3 py-1.5 rounded-full">
                    <span class="font-semibold text-sm">Account</span>
                </button>
            </div>
            <button onclick="toggleTheme()" class="text-sm bg-gray-200 px-3 py-1.5 rounded">Toggle Theme</button>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="p-8 max-w-7xl mx-auto space-y-8 flex-1 w-full">
        
        <!-- Dashboard Section -->
        <section id="dashboard-view" class="space-y-4">
            <h2 class="text-2xl font-bold">Monitored Target URLs & SSL Status</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="target-grid">
                <!-- Dynamically populated target cards -->
            </div>
        </section>

        <!-- Admin Panel Section -->
        <section id="admin-view" class="bg-white p-6 rounded-lg shadow space-y-6 text-gray-900">
            <h2 class="text-2xl font-bold">Admin Management Settings</h2>
            
            <!-- Target URL Management (Add/Edit/Delete) -->
            <div class="space-y-3">
                <h3 class="text-lg font-semibold">Manage Targets</h3>
                <div class="flex flex-col md:flex-row gap-2">
                    <input type="text" id="targetName" placeholder="Target Name (e.g. FOB Portal)" class="border p-2 rounded flex-1">
                    <input type="text" id="targetUrl" placeholder="https://fob.ng" class="border p-2 rounded flex-1">
                    <button onclick="addTarget()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Target</button>
                </div>
                <div id="admin-target-list" class="divide-y border rounded mt-4 bg-gray-50"></div>
            </div>

            <!-- Upload Logo Section -->
            <div class="space-y-3 border-t pt-4">
                <h3 class="text-lg font-semibold">Upload Company Logo (PNG Format)</h3>
                <div class="flex items-center space-x-2">
                    <input type="file" id="logoFile" accept=".png" class="border p-2 rounded bg-white">
                    <button onclick="uploadLogo()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Upload Logo</button>
                </div>
            </div>

            <!-- System Logs & Settings -->
            <div class="space-y-3 border-t pt-4">
                <h3 class="text-lg font-semibold">System Audit Logs</h3>
                <pre id="system-logs" class="bg-gray-900 text-green-400 p-4 rounded h-40 overflow-y-auto text-xs font-mono"></pre>
            </div>
        </section>

    </main>

    <!-- Footer Developer Tag -->
    <footer class="text-center py-6 text-sm text-gray-500 border-t bg-white">
        Developed and implemented for FOB infosystem by Femi Adeyemi.
    </footer>

    <!-- Client Script handling dynamic interactions -->
    <script>
        async function loadData() {
            try {
                const res = await fetch('/api/targets');
                const targets = await res.json();
                
                // Render Dashboard Grid with SSL metrics
                const grid = document.getElementById('target-grid');
                if (targets.length === 0) {
                    grid.innerHTML = '<p class="text-gray-500 col-span-3">No targets configured yet. Add targets via the Admin panel.</p>';
                } else {
                    grid.innerHTML = targets.map(t => `
                        <div class="bg-white p-4 rounded shadow border space-y-2 text-gray-900">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-lg">${t.name}</span>
                                <span class="text-xs uppercase px-2 py-1 rounded font-semibold ${t.status === 'Secure' ? 'bg-green-100 text-green-800' : (t.status === 'Expiring Soon' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800')}">${t.status}</span>
                            </div>
                            <div class="text-blue-600 text-sm truncate">${t.url}</div>
                            <div class="text-gray-500 text-xs">${t.ssl_info || 'Checking SSL...'}</div>
                        </div>
                    `).join('');
                }

                // Render Admin Table List with Edit / Delete actions
                const adminList = document.getElementById('admin-target-list');
                if (targets.length === 0) {
                    adminList.innerHTML = '<div class="p-3 text-gray-500">No targets found.</div>';
                } else {
                    adminList.innerHTML = targets.map(t => `
                        <div class="p-3 flex justify-between items-center bg-white">
                            <div>
                                <span class="font-medium">${t.name}</span> - <span class="text-gray-600 text-sm">${t.url}</span>
                            </div>
                            <div class="space-x-3">
                                <button onclick="editTarget(${t.id}, '${t.name}', '${t.url}')" class="text-blue-600 hover:underline text-sm font-medium">Edit</button>
                                <button onclick="deleteTarget(${t.id}, '${t.name}')" class="text-red-600 hover:underline text-sm font-medium">Delete</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error("Failed to load targets", err);
            }
        }

        async function loadLogs() {
            try {
                const res = await fetch('/api/admin/logs');
                const logs = await res.json();
                document.getElementById('system-logs').textContent = logs.join('\n');
            } catch (err) {
                console.error("Failed to load system logs", err);
            }
        }

        async function addTarget() {
            const name = document.getElementById('targetName').value.trim();
            const url = document.getElementById('targetUrl').value.trim();
            if (!name || !url) return alert("Please fill in all target fields.");
            
            await fetch('/api/targets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, url })
            });
            document.getElementById('targetName').value = '';
            document.getElementById('targetUrl').value = '';
            loadData();
            loadLogs();
        }

        // Delete with pop-up confirmation notification
        async function deleteTarget(id, name) {
            if (confirm(`Are you sure you want to delete target "${name}"?`)) {
                const res = await fetch(`/api/targets/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert(`Target "${name}" has been successfully deleted.`);
                    loadData();
                    loadLogs();
                } else {
                    alert("Failed to delete target.");
                }
            }
        }

        async function editTarget(id, oldName, oldUrl) {
            const name = prompt("Update target name:", oldName);
            const url = prompt("Update target URL:", oldUrl);
            if (name && url) {
                await fetch(`/api/targets/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, url })
                });
                loadData();
                loadLogs();
            }
        }

        async function uploadLogo() {
            const fileInput = document.getElementById('logoFile');
            if (fileInput.files.length === 0) return alert("Please select a PNG file first.");
            
            const formData = new FormData();
            formData.append('logo', fileInput.files[0]);

            const res = await fetch('/api/admin/logo', { method: 'POST', body: formData });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('company-logo').src = data.logoUrl + "?t=" + new Date().getTime();
                alert("Company logo uploaded successfully!");
                loadLogs();
            } else {
                const err = await res.text();
                alert(err);
            }
        }

        // Fixed Theme Toggle with LocalStorage persistence
        function toggleTheme() {
            const body = document.getElementById('app-body');
            const isDark = body.classList.toggle('bg-gray-950');
            body.classList.toggle('text-white', isDark);
            body.classList.toggle('bg-gray-100', !isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark') {
                toggleTheme();
            }
            loadData();
            loadLogs();
        };
    </script>
</body>
</html>
